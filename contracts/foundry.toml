[profile.default]
src = "src"
out = "out"
libs = ["../node_modules"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[invariant]
runs = 64
depth = 64
fail_on_revert = false
